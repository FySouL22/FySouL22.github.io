name: Site Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate maintained site pages
        run: |
          npx --yes html-validate@10 index.html 404.html
          echo "Legacy content pages are tracked separately until their accessibility debt is migrated."

      - name: Check internal/external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --root-dir . --accept 200,204,206,301,302,307,308,429,999 './index.html' './404.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
