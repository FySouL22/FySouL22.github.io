name: Site Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate all site pages
        run: |
          mapfile -d '' pages < <(find . -type f -name '*.html' -not -path './.git/*' -print0)
          npx --yes html-validate@10 "${pages[@]}"

      - name: Check internal/external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --verbose --no-progress --root-dir . --accept 200,202,204,206,301,302,307,308,429,999 './**/*.html' './README.md' './tools/**/README.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
